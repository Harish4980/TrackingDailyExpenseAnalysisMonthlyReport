<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Daily Expense Tracker</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #10b981;
            --primary-hover: #059669;
            --dark-surface: #0f172a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
            background-color: #0b1120;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.28) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.32) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(139, 92, 246, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.22) 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* Ambient floating glowing orbs */
        .ambient-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.65;
            animation: pulse-glow 8s ease-in-out infinite alternate;
        }

        .shape-1 {
            width: 380px;
            height: 380px;
            top: -100px;
            left: -100px;
            background: linear-gradient(135deg, #10b981, #06b6d4);
        }

        .shape-2 {
            width: 340px;
            height: 340px;
            bottom: -80px;
            right: -80px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            animation-delay: -4s;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1) translateY(0); opacity: 0.5; }
            100% { transform: scale(1.12) translateY(20px); opacity: 0.75; }
        }

        .grid-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 28px 28px;
            z-index: 1;
            pointer-events: none;
        }

        .register-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 2.5rem 2.25rem;
            border-radius: 24px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.9);
            transition: transform 0.3s ease;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .brand-icon-wrapper {
            width: 64px;
            height: 64px;
            margin: 0 auto 1rem;
            border-radius: 18px;
            background: linear-gradient(135deg, #10b981, #059669);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.45);
            color: #ffffff;
            font-size: 1.8rem;
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.025em;
            margin-bottom: 0.35rem;
        }

        .brand-subtitle {
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 1.15rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.45rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon-left {
            position: absolute;
            left: 1rem;
            color: #94a3b8;
            font-size: 1rem;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .form-control {
            width: 100%;
            padding: 0.82rem 1rem 0.82rem 2.75rem;
            font-size: 0.95rem;
            color: #0f172a;
            background-color: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-control.has-toggle {
            padding-right: 3rem;
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
        }

        .input-wrapper:focus-within .input-icon-left {
            color: #10b981;
        }

        /* Password Toggle Button */
        .password-toggle-btn {
            position: absolute;
            right: 0.75rem;
            background: none;
            border: none;
            color: #64748b;
            padding: 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            transition: color 0.2s ease, background-color 0.2s ease;
        }

        .password-toggle-btn:hover {
            color: #0f172a;
            background-color: #e2e8f0;
        }

        .submit-btn {
            width: 100%;
            margin-top: 0.5rem;
            padding: 0.95rem;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 18px -4px rgba(16, 185, 129, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.25s ease;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #059669, #047857);
            transform: translateY(-2px);
            box-shadow: 0 12px 22px -4px rgba(16, 185, 129, 0.5);
        }

        .login-footer {
            margin-top: 1.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
        }

        .login-footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 700;
            margin-left: 0.25rem;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .alert {
            margin-top: 1.25rem;
            padding: 0.85rem 1rem;
            border-radius: 12px;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 500;
        }

        .alert.danger {
            background-color: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .alert.success {
            background-color: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 2rem 1.5rem;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-shape shape-1"></div>
    <div class="ambient-shape shape-2"></div>
    <div class="grid-pattern"></div>

    <div class="register-card">
        <div class="brand-header">
            <div class="brand-icon-wrapper">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1 class="brand-title">Create Account</h1>
            <p class="brand-subtitle">Join Expense Tracker to organize your finances</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST">
            <!-- Full Name / Username -->
            <div class="form-group">
                <label class="form-label" for="username">Full Name / Username</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user input-icon-left"></i>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-control" 
                        placeholder="Enter your name" 
                        required
                    >
                </div>
            </div>

            <!-- Email or Phone -->
            <div class="form-group">
                <label class="form-label" for="identifier">Gmail or Phone Number</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-address-book input-icon-left"></i>
                    <input 
                        type="text" 
                        id="identifier" 
                        name="identifier" 
                        class="form-control" 
                        placeholder="Enter email or phone number" 
                        required
                    >
                </div>
            </div>

            <!-- Password with See/Hide toggle -->
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon-left"></i>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control has-toggle" 
                        placeholder="Create a secure password" 
                        autocomplete="new-password"
                        required
                    >
                    <button 
                        type="button" 
                        class="password-toggle-btn" 
                        id="toggleRegisterPasswordBtn" 
                        aria-label="Toggle password visibility"
                        title="Show/Hide Password"
                    >
                        <i class="fa-regular fa-eye" id="toggleRegisterIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <span>Sign Up</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="login-footer">
            Already have an account? <a href="{{ url_for('login') }}">Login here</a>
        </div>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert {{ category }}">
                        <i class="fa-solid {% if category == 'success' %}fa-circle-check{% else %}fa-circle-exclamation{% endif %}"></i>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <!-- Password Visibility Toggle Script -->
    <script>
        const toggleBtn = document.getElementById('toggleRegisterPasswordBtn');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggleRegisterIcon');

        toggleBtn.addEventListener('click', function () {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            
            if (isPassword) {
                passwordInput.setAttribute('type', 'text');
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.setAttribute('type', 'password');
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        });
    </script>
</body>
</html>
